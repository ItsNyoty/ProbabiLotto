<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProbabiLotto - Premium Prediction Engine</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <div class="container">
        <header>
            <div class="logo">ProbabiLotto</div>
            <p class="subtitle">Mathematical Precision. Statistical Mastery.</p>
        </header>
        <main>
            <section class="prediction-card glass-panel">
                <h2>Generate Prognosis</h2>
                
                <div class="game-selector">
                    <label for="game-select">Select Game:</label>
                    <select id="game-select" onchange="changeGame()">
                        <option value="lotto">Lotto</option>
                        <option value="extralotto">Extra Lotto</option>
                        <option value="euromillions">EuroMillions</option>
                        <option value="vikinglotto">VikingLotto</option>
                        <option value="jokerplus">Joker+</option>
                        <option value="pick3">Pick3</option>
                        <option value="keno">Keno</option>
                    </select>
                </div>
                
                <div id="game-note" style="display: none; text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem; font-style: italic;"></div>

                <div class="controls">
                    <button class="btn active" onclick="selectAlgorithm('hybrid')" id="btn-hybrid">Hybrid Model</button>
                    <button class="btn" onclick="selectAlgorithm('hot')" id="btn-hot">Hot Numbers</button>
                    <button class="btn" onclick="selectAlgorithm('cold')" id="btn-cold">Overdue Numbers</button>
                </div>
                
                <div class="result-display" id="result-container">
                    <div class="ball-group" id="main-balls">
                        <!-- Main balls -->
                    </div>
                    <div class="ball-group" id="special-balls">
                        <!-- Special balls -->
                    </div>
                </div>
                
                <div class="explanation-box" id="explanation">
                    <!-- Explanation text will appear here -->
                </div>

                <button class="action-btn" onclick="generatePrediction()">Predict Numbers</button>
            </section>

            <section class="stats-card glass-panel">
                <h2>Statistical Insights</h2>
                <div class="chart-container">
                    <canvas id="freqChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
